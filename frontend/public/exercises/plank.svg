<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Forearm plank</title>
  <desc id="desc">Side view: elbows beneath shoulders, forearms and toes on the floor, with head, hips, and heels aligned.</desc>
  <rect width="640" height="400" rx="24" fill="#111827"/>
  <path d="M65 305H575" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <path d="M142 201L510 276" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M195 221L330 249L440 272L505 285" stroke="#22d3ee" stroke-width="28"/>
    <path d="M196 228L192 296L126 296M505 285L522 302" stroke="#e2e8f0" stroke-width="18"/>
    <path d="M170 214L194 223" stroke="#e2e8f0" stroke-width="18"/>
  </g>
  <circle cx="151" cy="210" r="26" fill="#e2e8f0"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="320" y="60" fill="#f8fafc" font-size="27" font-weight="700">PLANK</text>
    <text x="320" y="100" fill="#94a3b8" font-size="18">Hold a straight line • Breathe steadily</text>
    <text x="320" y="357" fill="#cbd5e1" font-size="17">Elbows under shoulders • Brace your core</text>
  </g>
</svg>
