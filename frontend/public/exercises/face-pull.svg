    <text x="320" y="39" fill="#f8fafc" font-size="27" font-weight="700">FACE PULL</text>
    <text x="105" y="178" fill="#cbd5e1" font-size="17">Elbows out</text>
    <text x="526" y="125" fill="#cbd5e1" font-size="17">Hands by face</text>
    <text x="320" y="382" fill="#94a3b8" font-size="17">Finish position • Return slowly</text>
  </g>
</svg>
