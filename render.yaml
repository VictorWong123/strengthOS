services:
  - type: web
    name: strengthos-backend
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: EXERCISE_API_PROVIDER
        value: seed
      - key: EXERCISE_API_KEY
        sync: false
      - key: EXERCISE_API_HOST
        value: exercisedb.p.rapidapi.com
      - key: EXERCISE_API_BASE_URL
        value: https://exercisedb.p.rapidapi.com
      - key: EXERCISE_SYNC_PAGE_SIZE
        value: "100"
      - key: EXERCISE_API_MAX_RETRIES
        value: "3"
      - key: EXERCISE_API_MAX_RETRY_DELAY_SECONDS
        value: "30"
      - key: ADMIN_API_KEY
        sync: false
